<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Mobile Probe</title>
<style>
  :root { --bg: #f4f6fb; --card: #fff; --ink: #14213d; --muted: #5b6478; --line: #dfe4ee; --accent: #1360d6; --ok: #15803d; --bad: #b91c1c; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  .app { container-type: inline-size; min-height: 100vh; padding: 16px 16px 96px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .verdict { border-radius: 14px; padding: 14px 16px; color: #fff; margin-bottom: 14px; }
  .verdict b { display: block; font-size: 17px; }
  .verdict span { font-size: 13px; opacity: .92; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 5px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td:first-child { color: var(--muted); padding-right: 10px; white-space: nowrap; }
  td:last-child { text-align: right; word-break: break-word; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 10px 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* Container query: lays out by the app's real width, not the media-query viewport. */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @container (max-width: 600px) { .tiles { grid-template-columns: repeat(2, 1fr); } .cq-label::after { content: "phone layout (container query)"; } }
  @container (min-width: 601px) { .cq-label::after { content: "wide layout (container query)"; } }
  .tile { background: #eef3ff; border-radius: 10px; padding: 14px 8px; text-align: center; font-size: 13px; }
  .mq-label::after { content: "wide (media query)"; }
  @media (max-width: 767px) { .mq-label::after { content: "phone (media query)"; } }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; background: #fff; border-top: 1px solid var(--line); padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
  .bar div { text-align: center; font-size: 11px; color: var(--muted); }
  .bar div i { display: block; width: 22px; height: 22px; margin: 0 auto 2px; border-radius: 7px; background: #cfd8ea; }
  .bar div.on { color: var(--accent); } .bar div.on i { background: var(--accent); }
  textarea { width: 100%; height: 120px; font: 12px/1.4 ui-monospace, monospace; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
</style>
</head>
<body>
<div class="app">
  <h1>Mobile probe</h1>
  <p class="sub">Open this page with “Desktop site” <b>off</b>, then <b>on</b>, and send me both reports.</p>

  <div id="verdict" class="verdict"></div>

  <div class="card">
    <h2>Forced phone layout</h2>
    <div class="row" style="margin-bottom:10px">
      <button id="zoomOn" class="primary">Force phone layout</button>
      <button id="zoomOff">Turn off</button>
    </div>
    <p class="sub" style="margin:0 0 8px">Should look like a normal phone page: big text, 2 tiles per row, bottom bar at the bottom edge.</p>
    <div class="tiles"><div class="tile">Menu</div><div class="tile">Rebates</div><div class="tile">Complaints</div><div class="tile">Profile</div></div>
    <p class="sub" style="margin:8px 0 0"><span class="cq-label"></span> · <span class="mq-label"></span></p>
  </div>

  <div class="card"><h2>Measurements</h2><table id="m"></table></div>

  <div class="card">
    <h2>Report</h2>
    <textarea id="report" readonly></textarea>
    <div class="row" style="margin-top:8px"><button id="copy" class="primary">Copy report</button><button id="refresh">Refresh numbers</button></div>
  </div>
</div>

<nav class="bar"><div class="on"><i></i>Home</div><div><i></i>Dining</div><div><i></i>Requests</div><div><i></i>More</div></nav>

<script>
(function () {
  var root = document.documentElement;
  var mq = function (q) { return window.matchMedia(q).matches; };
  var forced = false;

  // The phone's real CSS width in the current orientation.
  function phoneWidth() { var a = Math.min(screen.width, screen.height), b = Math.max(screen.width, screen.height); return mq("(orientation: portrait)") ? a : b; }
  function isPhone() { return mq("(pointer: coarse)") && mq("(hover: none)") && Math.min(screen.width, screen.height) < 600; }
  function zoomNow() { return parseFloat(root.style.zoom) || 1; }

  function applyZoom() {
    root.style.zoom = "";
    var z = window.innerWidth / phoneWidth();
    if (z > 1.15) root.style.zoom = z.toFixed(4);
    forced = true; render();
  }
  function clearZoom() { root.style.zoom = ""; forced = false; render(); }

  function data() {
    var vv = window.visualViewport;
    var probe = document.createElement("div");
    probe.style.cssText = "position:absolute;top:0;left:0;width:1px;height:100vh;visibility:hidden";
    document.body.appendChild(probe);
    var vhPx = probe.getBoundingClientRect().height; probe.remove();
    var app = document.querySelector(".app").getBoundingClientRect().width;
    var uad = navigator.userAgentData;
    return {
      verdictPhone: isPhone(),
      desktopSiteOn: isPhone() && window.innerWidth > phoneWidth() * 1.3,
      forcedZoom: zoomNow(),
      innerWidth: window.innerWidth,
      innerHeight: window.innerHeight,
      clientWidth: root.clientWidth,
      appWidthCssPx: Math.round(app),
      screen: screen.width + " x " + screen.height,
      dpr: window.devicePixelRatio,
      visualViewport: vv ? Math.round(vv.width) + " x " + Math.round(vv.height) + " @ scale " + vv.scale.toFixed(3) : "n/a",
      vvRealWidth: vv ? Math.round(vv.width * vv.scale) : "n/a",
      "100vh (px, rendered)": Math.round(vhPx),
      pointerCoarse: mq("(pointer: coarse)"),
      hoverNone: mq("(hover: none)"),
      anyPointerFine: mq("(any-pointer: fine)"),
      maxTouchPoints: navigator.maxTouchPoints,
      uaMobile: uad ? uad.mobile : "n/a",
      platform: uad ? uad.platform : navigator.platform,
      standalone: mq("(display-mode: standalone)") || navigator.standalone === true,
      cssZoomSupported: CSS.supports("zoom", "2"),
      containerQueries: CSS.supports("container-type", "inline-size"),
      userAgent: navigator.userAgent
    };
  }

  function render() {
    var d = data();
    var v = document.getElementById("verdict");
    var title, note, color;
    if (!d.verdictPhone) { title = "Not detected as a phone"; note = "Touch-only + small screen test failed (tablet/laptop/desktop)."; color = "#475569"; }
    else if (d.desktopSiteOn && !forced) { title = "Phone with “Desktop site” ON"; note = "Tap “Force phone layout” and check it looks right."; color = "#b45309"; }
    else if (d.desktopSiteOn && forced) { title = "Desktop site ON — phone layout forced"; note = "If tiles show 2 per row and text is normal size, forcing works."; color = "#15803d"; }
    else { title = "Phone, normal mobile view"; note = "Desktop site is off. Now turn it on and reload."; color = "#1360d6"; }
    v.style.background = color;
    v.innerHTML = "<b>" + title + "</b><span>" + note + "</span>";
    var rows = "";
    Object.keys(d).forEach(function (k) { if (k !== "userAgent") rows += "<tr><td>" + k + "</td><td>" + d[k] + "</td></tr>"; });
    rows += "<tr><td>userAgent</td><td style='font-size:11px'>" + d.userAgent + "</td></tr>";
    document.getElementById("m").innerHTML = rows;
    document.getElementById("report").value = JSON.stringify(d, null, 1);
  }

  document.getElementById("zoomOn").onclick = applyZoom;
  document.getElementById("zoomOff").onclick = clearZoom;
  document.getElementById("refresh").onclick = render;
  document.getElementById("copy").onclick = function () {
    var t = document.getElementById("report"); t.select();
    (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).catch(function () { document.execCommand("copy"); });
    this.textContent = "Copied";
  };
  window.addEventListener("resize", function () { if (forced) applyZoom(); else render(); });
  render();
})();
</script>
</body>
</html>
